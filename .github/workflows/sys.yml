name: sys

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CMAKE_GENERATOR: Ninja

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: install native tools
        run: sudo apt-get update && sudo apt-get install --yes binutils build-essential clang cmake jq ninja-build
      - name: install pinned maintainer tools
        run: |
          cargo install bindgen-cli --version 0.72.1 --locked
          cargo install just --version 1.40.0 --locked
      - name: check formatting
        run: just fmt-check
      - name: lint
        run: just lint
      - name: check generated bindings and ffi conformance
        run: just sys
      - name: test Linux CPU link modes
        run: just link-modes
      - name: test packaged sys crate and downstream fixture
        run: just package-test
